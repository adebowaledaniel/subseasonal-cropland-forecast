# NIRv only (autoregressive reference)
model: convlstm
input_bands: [1]
target_band: 1
tlen: 6
forecast_horizon: 5
hidden_dims: [64, 64]
kernel_sizes: [3, 3]
dropout: 0.18
loss: huber
lr: 1.0e-3
weight_decay: 1.0e-4  # as in the published runs; the other configurations use 1e-5
batch_size: 32
epochs: 100
patience: 25
