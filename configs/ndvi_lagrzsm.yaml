# NDVI target, NDVI + lag-shifted RZSM with the NDVI lag map
model: convlstm
input_bands: [0]
lagged_rzsm: true
lag_variable: NDVI
target_band: 0
tlen: 6
forecast_horizon: 5
hidden_dims: [64, 64]
kernel_sizes: [3, 3]
dropout: 0.18
loss: huber
lr: 1.0e-3
weight_decay: 1.0e-5
batch_size: 32
epochs: 100
patience: 25
